services:
  postgres:
    image: postgres:16-alpine
    container_name: habitpulse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: habitpulse
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d habitpulse"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - habitpulse-network

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: habitpulse-api
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: "3000"
      HOST: "0.0.0.0"
      DATABASE_URL: "postgres://postgres:postgres@postgres:5432/habitpulse"
      CORS_ORIGIN: "*"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/readyz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - habitpulse-network

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: habitpulse-web
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:80/healthz || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - habitpulse-network

volumes:
  postgres_data:

networks:
  habitpulse-network:
    driver: bridge
