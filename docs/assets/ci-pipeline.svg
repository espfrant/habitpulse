<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 210" width="100%" height="100%" font-family="Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace">
  <defs>
    <marker id="ci-arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#cba6f7" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="920" height="210" rx="16" fill="#1e1e2e" stroke="#313244" stroke-width="2" />

  <!-- Title -->
  <text x="460" y="32" text-anchor="middle" fill="#cdd6f4" font-size="14" font-weight="700" letter-spacing="0.5">
    GITHUB ACTIONS CI/CD PIPELINE (.github/workflows/ci.yml)
  </text>

  <!-- Step 1: Trigger -->
  <rect x="28" y="65" width="145" height="110" rx="10" fill="#181825" stroke="#cba6f7" stroke-width="1.5" />
  <text x="100" y="95" text-anchor="middle" fill="#cba6f7" font-size="12" font-weight="700">1. Trigger</text>
  <text x="100" y="120" text-anchor="middle" fill="#cdd6f4" font-size="11" font-weight="600">Git Push / PR</text>
  <text x="100" y="140" text-anchor="middle" fill="#a6adc8" font-size="10">branch: main</text>
  <text x="100" y="156" text-anchor="middle" fill="#a6adc8" font-size="10">ubuntu-latest</text>

  <!-- Step 2: Job 1 Verify -->
  <rect x="215" y="52" width="415" height="136" rx="10" fill="#181825" stroke="#89b4fa" stroke-width="1.5" />
  <text x="422" y="75" text-anchor="middle" fill="#89b4fa" font-size="12" font-weight="700">
    2. Job 1: Quality Gates &amp; Integration Suite
  </text>

  <rect x="232" y="88" width="182" height="40" rx="6" fill="#313244" />
  <text x="323" y="106" text-anchor="middle" fill="#cdd6f4" font-size="11" font-weight="600">Postgres 16 Service</text>
  <text x="323" y="120" text-anchor="middle" fill="#94e2d5" font-size="9">Health-checked container</text>

  <rect x="430" y="88" width="182" height="40" rx="6" fill="#313244" />
  <text x="521" y="106" text-anchor="middle" fill="#cdd6f4" font-size="11" font-weight="600">Lint &amp; Typecheck</text>
  <text x="521" y="120" text-anchor="middle" fill="#a6adc8" font-size="9">pnpm lint &amp;&amp; pnpm typecheck</text>

  <rect x="232" y="136" width="182" height="40" rx="6" fill="#313244" />
  <text x="323" y="154" text-anchor="middle" fill="#cdd6f4" font-size="11" font-weight="600">Vitest Suite (51 Tests)</text>
  <text x="323" y="168" text-anchor="middle" fill="#a6e3a1" font-size="9">Unit + API + React UI</text>

  <rect x="430" y="136" width="182" height="40" rx="6" fill="#313244" />
  <text x="521" y="154" text-anchor="middle" fill="#cdd6f4" font-size="11" font-weight="600">Production Build</text>
  <text x="521" y="168" text-anchor="middle" fill="#a6adc8" font-size="9">tsc &amp;&amp; vite build</text>

  <!-- Step 3: Job 2 Docker -->
  <rect x="672" y="52" width="220" height="136" rx="10" fill="#181825" stroke="#a6e3a1" stroke-width="1.5" />
  <text x="782" y="75" text-anchor="middle" fill="#a6e3a1" font-size="12" font-weight="700">
    3. Job 2: Container Build
  </text>

  <rect x="690" y="90" width="184" height="38" rx="6" fill="#313244" />
  <text x="782" y="108" text-anchor="middle" fill="#cdd6f4" font-size="11" font-weight="600">API Image (Node 22)</text>
  <text x="782" y="121" text-anchor="middle" fill="#a6adc8" font-size="9">apps/api/Dockerfile</text>

  <rect x="690" y="136" width="184" height="38" rx="6" fill="#313244" />
  <text x="782" y="154" text-anchor="middle" fill="#cdd6f4" font-size="11" font-weight="600">Web Image (Nginx 1.27)</text>
  <text x="782" y="167" text-anchor="middle" fill="#a6adc8" font-size="9">apps/web/Dockerfile</text>

  <!-- Arrows -->
  <line x1="173" y1="120" x2="210" y2="120" stroke="#cba6f7" stroke-width="2" marker-end="url(#ci-arrow)" />
  <line x1="630" y1="120" x2="667" y2="120" stroke="#cba6f7" stroke-width="2" marker-end="url(#ci-arrow)" />
</svg>
