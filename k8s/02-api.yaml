apiVersion: v1
kind: ConfigMap
metadata:
  name: api-config
  namespace: habitpulse
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: habitpulse
data:
  NODE_ENV: "production"
  PORT: "3000"
  HOST: "0.0.0.0"
  DATABASE_URL: "postgres://postgres:postgres@postgres.habitpulse.svc.cluster.local:5432/habitpulse"
  CORS_ORIGIN: "*"
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: habitpulse
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: habitpulse
spec:
  type: ClusterIP
  ports:
    - port: 3000
      targetPort: 3000
      name: http
      protocol: TCP
  selector:
    app.kubernetes.io/name: api
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: habitpulse
  labels:
    app.kubernetes.io/name: api
    app.kubernetes.io/part-of: habitpulse
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: api
        app.kubernetes.io/part-of: habitpulse
    spec:
      containers:
        - name: api
          image: habitpulse-api:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
              name: http
          envFrom:
            - configMapRef:
                name: api-config
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /healthz
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /readyz
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 2
