apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: habitpulse-ingress
  namespace: habitpulse
  labels:
    app.kubernetes.io/name: habitpulse
    app.kubernetes.io/part-of: habitpulse
  annotations:
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
    nginx.ingress.kubernetes.io/proxy-body-size: "8m"
spec:
  ingressClassName: nginx
  rules:
    - http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 3000
          - path: /docs
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 3000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 80
